services:
  front:
    build:
      context: .
      args:
        VITE_API_BASE_URL: http://localhost:8400
    container_name: procovar-front
    restart: unless-stopped
    ports:
      # Host 5001 -> container 5000: el nginx del host proxya pedidos a :5001, y :5000
      # ya lo usa otra app en el VPS. (Cambiar aquí si el entorno usa otro puerto.)
      - "5001:5000"
