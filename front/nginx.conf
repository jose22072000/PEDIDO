server {
  listen 5000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Solo estático + fallback SPA. En este despliegue el nginx del HOST rutea /api
  # hacia :8400 (incluido /api/orders/stream con SSE). NO proxear /api aquí: el front
  # y la api corren en composes/redes distintas, así que un upstream por nombre (p. ej.
  # pedido-api) no resuelve y nginx no arranca (host not found in upstream).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
