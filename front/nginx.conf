server {
  listen 5000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Solo estático + fallback SPA. En este despliegue el nginx del HOST rutea /api
  # hacia :8400 (incluido /api/orders/stream con SSE). NO proxear /api aquí: el front
  # y la api corren en composes/redes distintas, así que un upstream por nombre (p. ej.
  # pedido-api) no resuelve y nginx no arranca (host not found in upstream).

  # Los assets de Vite llevan hash en el nombre (index-48cMEK6I.js): si cambia el
  # contenido, cambia el nombre. Así que se pueden cachear para siempre. Sin esta
  # cabecera el navegador revalidaba el bundle en CADA carga; con ~180ms de ida y
  # vuelta hasta el servidor, eso es medio segundo perdido por archivo y por visita.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # El resto de estáticos (favicon, iconos de la PWA, imágenes) no llevan hash:
  # se cachean un día y se revalidan.
  location ~* \.(ico|png|jpg|jpeg|svg|webp|woff2?)$ {
    expires 1d;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # index.html NUNCA se cachea: es quien apunta a los assets con hash nuevo. Si se
  # cacheara, un deploy no se vería hasta que expirase — el bug clásico de "arreglé
  # esto y sigue saliendo lo viejo".
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires -1;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires -1;
  }
}
